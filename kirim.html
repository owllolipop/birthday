<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirim ucapan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <meta name="robots" content="noindex">
</head>
<body>
  <main class="page">
    <h1 id="title"></h1>
    <p class="lead">Thanks for dropping by and leaving a message for yolski guys, write down any wishes, prayers, or whatever you'd like to say below. Thank youuuuououou</p>

    <div class="sheet">
      <form id="form">
        <div class="field">
          <label for="name">Namamu</label>
          <input id="name" type="text" maxlength="60" required autocomplete="name">
        </div>
        <div class="field">
          <label for="message">Ucapan dan doa</label>
          <textarea id="message" maxlength="1000" required></textarea>
        </div>
        <div class="field">
          <label for="photo">Foto <span class="opt">(boleh dikosongin ye)</span></label>
          <input id="photo" type="file" accept="image/*">
          <img id="preview" class="preview" alt="Pratinjau foto" hidden>
        </div>
        <button class="btn" id="send" type="submit">Kirim ucapan</button>
        <p class="msg" id="status" role="status"></p>
      </form>

      <div class="done" id="done" hidden>
        <h2>Terkirim!</h2>
        <p>Terima kasih, <span id="doneName"></span>. Ucapanmu sudah masuk.</p>
        <button class="btn" id="again" type="button">Kirim satu lagi</button>
      </div>
    </div>
  </main>

  <button id="muteBtn" type="button" hidden
    style="position:fixed;bottom:18px;right:18px;z-index:50;width:48px;height:48px;border-radius:50%;border:0;background:var(--pink,#b8a598);color:var(--ink,#2a221e);font-size:20px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.3);">
    🔊
  </button>
  <audio id="bgm" src="lagu.mp3" loop preload="auto"></audio>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const C = window.APP;
    const $ = (s) => document.querySelector(s);
    const demo = C.SUPABASE_URL.startsWith("YOUR");

    $("#title").textContent = "Ucapan untuk " + C.NAME;
    document.title = "Ucapan untuk " + C.NAME;
